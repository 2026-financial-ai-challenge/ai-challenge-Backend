services:
  backend:
    build: .
    container_name: phishing-call-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      # Local Docker cannot resolve Railway's *.railway.internal hostname.
      # Use Railway's public URL when supplied; otherwise use the local DB service.
      DATABASE_URL: "${DATABASE_PUBLIC_URL:-postgresql://safety_phishing_user:${LOCAL_DB_PASSWORD:-local_dev_password}@db:5432/safety_phishing_call}"
    depends_on:
      - db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
  db:
    image: postgres:16
    container_name: safety-phishing-db
    environment:
      POSTGRES_DB: safety_phishing_call
      POSTGRES_USER: safety_phishing_user
      POSTGRES_PASSWORD: "${LOCAL_DB_PASSWORD:-local_dev_password}"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
