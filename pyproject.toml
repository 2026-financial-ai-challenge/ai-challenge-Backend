[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "safety-phishing-call-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
    "sounddevice>=0.5.0",
    "pydantic>=2.0.0",
    "websockets>=12.0",
]

[project.scripts]
test-stt = "ai.test_stt:main"
test-latency = "ai.test_latency:main"

[tool.setuptools.packages.find]
include = ["ai", "ai.*"]
