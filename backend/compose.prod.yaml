# Lightsail 같은 단일 서버 배포용. 개발용 compose.yaml과 달리 코드 리로드가 없고,
# DB·Redis 포트를 밖으로 열지 않으며, HTTPS는 Caddy가 맡습니다.
#
#   docker compose -f compose.prod.yaml up -d --build
#
# .env에 DOMAIN(예: 3-35-12-34.sslip.io)과 LOCAL_DB_PASSWORD를 넣어야 합니다.
services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://safety_phishing_user:${LOCAL_DB_PASSWORD}@db:5432/safety_phishing_call"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: safety_phishing_call
      POSTGRES_USER: safety_phishing_user
      POSTGRES_PASSWORD: "${LOCAL_DB_PASSWORD:?LOCAL_DB_PASSWORD must be set}"
    # 서버 자신(127.0.0.1)에게만 엽니다. DBeaver 등은 SSH 터널로 들어옵니다.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safety_phishing_user -d safety_phishing_call"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  caddy_data:
